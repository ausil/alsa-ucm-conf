# MediaTek MT8901 (NVIDIA N1X) SoundWire card, as on the HP OmniBook X 14:
#   link 0: 2x CS35L56 speaker amps (AMP1/AMP2)
#   link 1: CS42L43 headset codec with SmartMic DMICs
#
# Playback: AFE memif DLx -> I-port -> O-port (mixer switch) -> PDI
#   -> "PDIn Demux" -> manager data port DPm -> codec.
# Capture:  codec -> DPm -> "PDIn Mux" -> PDI -> I-port -> O-port -> ULx.
# DPs come from the firmware's acpi-scd-dp-allocation: link 0 playback
# DP2..DP4, link 1 playback DP5..DP6 and capture DP12..DP14.
#
# The DPCM front ends only open when a back end is reachable, and
# PipeWire probes the PCMs without running the device sequences, so the
# AFE and SoundWire routes are enabled with the verb.

SectionVerb {
	EnableSequence [
		# Speaker: DL0 -> O150/O151 -> PDI2 -> DP2 (SDW0_Playback0)
		cset "name='O150 I032 Switch' on"
		cset "name='O151 I033 Switch' on"
		cset "name='PDI2 Demux' 'DP2'"
		# Headphones: DL1 -> O156/O157 -> PDI5 -> DP5 (SDW1_Playback0)
		cset "name='O156 I034 Switch' on"
		cset "name='O157 I035 Switch' on"
		cset "name='PDI5 Demux' 'DP5'"
		# Headset mic: DP12 (SDW1_Capture0) -> PDI7 -> O020/O021 -> UL1
		cset "name='PDI7 Mux' 'DP12'"
		cset "name='O020 I168 Switch' on"
		cset "name='O021 I169 Switch' on"
		# Internal mics: DP13 (SDW1_Capture1) -> PDI8 -> O018/O019 -> UL0
		cset "name='PDI8 Mux' 'DP13'"
		cset "name='O018 I170 Switch' on"
		cset "name='O019 I171 Switch' on"

		cset "name='AMP1 Speaker Switch' off"
		cset "name='AMP2 Speaker Switch' off"
		cset "name='Headphone Switch' off"
		cset "name='Headset Mic Switch' off"
	]

	DisableSequence [
		cset "name='O150 I032 Switch' off"
		cset "name='O151 I033 Switch' off"
		cset "name='PDI2 Demux' 'None'"
		cset "name='O156 I034 Switch' off"
		cset "name='O157 I035 Switch' off"
		cset "name='PDI5 Demux' 'None'"
		cset "name='O020 I168 Switch' off"
		cset "name='O021 I169 Switch' off"
		cset "name='PDI7 Mux' 'None'"
		cset "name='O018 I170 Switch' off"
		cset "name='O019 I171 Switch' off"
		cset "name='PDI8 Mux' 'None'"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	EnableSequence [
		cset "name='AMP1 Speaker Switch' on"
		cset "name='AMP2 Speaker Switch' on"
	]

	DisableSequence [
		cset "name='AMP1 Speaker Switch' off"
		cset "name='AMP2 Speaker Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	EnableSequence [
		cset "name='Headphone Switch' on"
	]

	DisableSequence [
		cset "name='Headphone Switch' off"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackVolume "cs42l43 Headphone Digital Volume"
		JackControl "Headphone Jack"
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"

	EnableSequence [
		cset "name='cs42l43 ADC1 Input' 'IN1'"
		cset "name='cs42l43 Decimator 1 Mode' 'ADC'"
		cset "name='cs42l43 Decimator 1 Switch' on"
		cset "name='cs42l43 DP2TX1 Input' 'Decimator 1'"
		cset "name='cs42l43 DP2TX2 Input' 'Decimator 1'"
		cset "name='Headset Mic Switch' on"
	]

	DisableSequence [
		cset "name='Headset Mic Switch' off"
		cset "name='cs42l43 DP2TX1 Input' 'None'"
		cset "name='cs42l43 DP2TX2 Input' 'None'"
		cset "name='cs42l43 Decimator 1 Switch' off"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},8"
		CaptureVolume "cs42l43 Decimator 1 Volume"
		JackControl "Headset Mic Jack"
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphones"

	EnableSequence [
		cset "name='cs42l43 Decimator 3 Switch' on"
		cset "name='cs42l43 Decimator 4 Switch' on"
		cset "name='cs42l43 DP1TX1 Input' 'Decimator 3'"
		cset "name='cs42l43 DP1TX2 Input' 'Decimator 4'"
	]

	DisableSequence [
		cset "name='cs42l43 DP1TX1 Input' 'None'"
		cset "name='cs42l43 DP1TX2 Input' 'None'"
		cset "name='cs42l43 Decimator 3 Switch' off"
		cset "name='cs42l43 Decimator 4 Switch' off"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},7"
	}
}
